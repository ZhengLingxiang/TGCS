
optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0005,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10
}}

dataset : {
  train : { _base_: cfgs/dataset_configs/ModelNet40.yaml,
            others: {subset: 'train'}},
  val : { _base_: cfgs/dataset_configs/ModelNet40.yaml,
            others: {subset: 'test'}},
  test : { _base_: cfgs/dataset_configs/ModelNet40.yaml,
            others: {subset: 'test'}}}
model : {
  NAME: PointMAE_Transformer_TGCS,
  trans_dim: 384,
  depth: 12,
  drop_path_rate: 0.1,
  cls_dim: 40,
  num_heads: 6,
  group_size: 32,
  num_group: 64,
  encoder_dims: 384,
  show_attn: false,

  mixer: {
    multi_scale_agg: true,
    hidden: 24,
    k_small: 8,
    k_large: 24
  },

  gate: {
    saliency_gate: true,
    hidden: 64,
    temperature: 1.0
  },

  TopoMixXScale_adapter: {
    enabled: true,
    hidden: 12,
    k_list: [ 8, 16, 24, 48 ]
  }
}


npoints: 1024
total_bs : 32
step_per_update : 1
max_epoch : 300
grad_norm_clip : 10
task: 'classification'
show_attn: false