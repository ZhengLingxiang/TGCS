optimizer: {
  type: AdamW,
  kwargs: {
    lr: 0.0005,
    weight_decay: 0.05
  } }

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs: 30
  } }

dataset:
  {
    train:
      {
        _base_: cfgs/dataset_configs/ModelNet40FewShot.yaml,
        others: { subset: "train" },
      },
    val:
      {
        _base_: cfgs/dataset_configs/ModelNet40FewShot.yaml,
        others: { subset: "test" },
      },
    test:
      {
        _base_: cfgs/dataset_configs/ModelNet40.yaml,
        others: { subset: "test" },
      },
  }
model:
  {
    NAME: GPT_Transformer_TGCS,
    trans_dim: 1024,
    depth: 24,
    drop_path_rate: 0.1,
    cls_dim: 40,
    num_heads: 16,
    group_size: 32,
    num_group: 64,
    encoder_dims: 1024,
    decoder_depth: 4,
    loss: cdl2,
    weight_center: 1,
    show_attn: false,

    mixer: {
      multi_scale_agg: true,
      hidden: 32,
      k_small: 8,
      k_large: 24
    },

    gate: {
      saliency_gate: true,
      hidden: 128,
      temperature: 1.0
    },

    TopoMixXScale_adapter: {
      enabled: true,
      hidden: 15,
      k_list: [ 8 ]
    }

  }

npoints: 1024
total_bs: 32
step_per_update: 1
max_epoch: 300
grad_norm_clip: 10
show_attn: false
