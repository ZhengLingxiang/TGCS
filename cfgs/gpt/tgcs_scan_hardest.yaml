optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.0001,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 100,
    initial_epochs : 10
}}

dataset : {
  train : { _base_: ./cfgs/dataset_configs/ScanObjectNN_hardest.yaml,
            others: {subset: 'train'}},
  val : { _base_: ./cfgs/dataset_configs/ScanObjectNN_hardest.yaml,
            others: {subset: 'test'}},
  test : { _base_: ./cfgs/dataset_configs/ScanObjectNN_hardest.yaml,
            others: {subset: 'test'}}}

model : {
  NAME: GPT_Transformer_TGCS,
  trans_dim: 1024,
  depth: 24,
  drop_path_rate: 0.2,
  cls_dim: 15,
  num_heads: 16,
  group_size: 32,
  num_group: 128,
  encoder_dims: 1024,
  decoder_depth: 4,
  show_attn: false,

  mixer: {
    multi_scale_agg: true,
    hidden: 32,
    k_small: 8,
    k_large: 24
  },

  gate: {
    saliency_gate: true,
    hidden: 128,
    temperature: 1.0
  },

  TopoMixXScale_adapter: {
    enabled: true,
    hidden: 15,
    k_list: [2, 4, 8, 12, 16, 24, 32, 48]
  }

}

npoints: 2048
total_bs : 64
step_per_update : 1
max_epoch : 100
grad_norm_clip : 10
task: 'classification'
show_attn: false